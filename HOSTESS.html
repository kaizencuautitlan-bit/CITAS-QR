<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recepción Hostess · Toyota Cuautitlán</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --primary: #c8102e;
      --primary-hover: #a30c24;
      --green: #1e6b3b;
      --orange: #b84a0b;
      --red: #b51228;
      --bg: #eef0f3;
      --card: #ffffff;
      --text: #1f242b;
      --muted: #5f6773;
      --border: #e2e6ec;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 14px;
    }
    .container { max-width: 520px; margin: 0 auto; }
    .header-brand {
      background: var(--card);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(31, 36, 43, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .header-logo {
      height: 36px;
      width: auto;
      object-fit: contain;
    }
    .header-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-btn {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d4d9e2;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      background: #ffffff;
      color: var(--muted);
    }
    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 3px 12px rgba(31, 36, 43, 0.07);
      margin-bottom: 16px;
    }
    h1 { font-size: 1.15rem; margin: 0 0 12px 0; text-align: center; color: var(--text); }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #1f242b; }
    .status-msg { text-align: center; font-size: 0.88rem; color: var(--muted); margin: 10px 0 0 0; }

    /* Alerta de QR ya usado */
    .alerta-usado {
      background: #fdf2f4;
      border: 1px solid #f5c2cb;
      color: var(--primary);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: none;
    }

    /* Ficha principal de la Hostess */
    .ficha { display: none; border-top: 5px solid var(--primary); }
    .hero-box {
      background: #f8f9fb;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .label-sm {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .val-cliente { font-size: 1.45rem; font-weight: 800; color: var(--text); margin: 2px 0 10px 0; }
    .val-servicio {
      display: inline-block;
      background: #fdf2f4;
      border: 1px solid #f5c2cb;
      color: var(--primary);
      font-weight: 800;
      font-size: 1rem;
      padding: 5px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .val-vin {
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: 700;
      background: #1f242b;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .extra-info {
      font-size: 0.88rem;
      color: #374151;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .acciones-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: white;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-asistio { background: var(--green); }
    .btn-tarde { background: var(--orange); }
    .btn-noshow { background: var(--red); }
    .btn-secundario { background: #eceff4; color: var(--text); margin-top: 10px; }

    /* Formulario Sin Cita */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px; border: 1px solid #cfd5df; border-radius: 8px; font-size: 0.95rem; color: var(--text);
    }
    .badge-estado {
      float: right;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #eceff4;
      color: var(--text);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-brand">
    <img src="https://image.jimcdn.com/app/cms/image/transf/none/path/s249377f5b481489b/image/i37e7608f0284c2e1/version/1723751621/image.png" alt="Logo Toyota Cuautitlán" class="header-logo" onerror="this.style.display='none'">
    <span class="header-label">Recepción · Hostess</span>
  </div>

  <div class="tabs">
    <button id="tabEscaner" class="tab-btn active" onclick="cambiarVista('escaner')">Escanear QR</button>
    <button id="tabSinCita" class="tab-btn" onclick="cambiarVista('sincita')">+ Llegó Sin Cita</button>
  </div>

  <!-- VISTA 1: ESCÁNER -->
  <div id="vistaEscaner">
    <div class="card">
      <h1>Escáner de Recepción</h1>
      <div id="reader"></div>
      <p id="statusText" class="status-msg">Apunta la cámara al QR del cliente</p>
    </div>

    <div id="fichaCliente" class="card ficha">
      <span id="estadoActualBadge" class="badge-estado"></span>
      <div id="alertaYaUsado" class="alerta-usado">
        Este código QR ya fue escaneado y registrado anteriormente. No se puede volver a procesar.
      </div>

      <div class="hero-box">
        <div class="label-sm">Cliente</div>
        <div id="valNombre" class="val-cliente"></div>

        <div class="label-sm">Tipo de Servicio</div>
        <div><span id="valServicio" class="val-servicio"></span></div>

        <div class="label-sm">VIN del Vehículo</div>
        <div id="valVin" class="val-vin"></div>
      </div>

      <div id="extraDatos" class="extra-info"></div>

      <div id="bloqueAcciones">
        <div class="label-sm" style="margin-bottom:8px;">Marcar estatus de asistencia:</div>
        <div class="acciones-grid">
          <button id="btnAsistio" class="btn btn-asistio" onclick="actualizarEstatus('Asistió')">Asistió a tiempo</button>
          <button id="btnTarde" class="btn btn-tarde" onclick="actualizarEstatus('Llegó tarde')">Llegó tarde</button>
          <button id="btnNoShow" class="btn btn-noshow" onclick="actualizarEstatus('No asistió')">No asistió (No Show)</button>
        </div>
      </div>

      <button class="btn btn-secundario" onclick="reiniciarEscaner()">Escanear Siguiente Cliente</button>
    </div>
  </div>

  <!-- VISTA 2: CAPTURA SIN CITA -->
  <div id="vistaSinCita" style="display:none;">
    <div class="card">
      <h1>Registro Rápido · Sin Cita</h1>
      <form id="formSinCita">
        <div class="form-group">
          <label>Nombre completo *</label>
          <input type="text" id="sc_nombre" required placeholder="Nombre del cliente">
        </div>
        <div class="form-group">
          <label>Teléfono *</label>
          <input type="tel" id="sc_telefono" required placeholder="10 dígitos">
        </div>
        <div class="form-group">
          <label>Correo electrónico *</label>
          <input type="email" id="sc_correo" required placeholder="cliente@correo.com">
        </div>
        <div class="form-group">
          <label>Modelo del vehículo *</label>
          <input type="text" id="sc_modelo" required placeholder="Ej. Yaris 2023">
        </div>
        <div class="form-group">
          <label>Placa</label>
          <input type="text" id="sc_placa" placeholder="ABC-123-D" style="text-transform:uppercase;">
        </div>
        <div class="form-group">
          <label>VIN (17 caracteres)</label>
          <input type="text" id="sc_vin" maxlength="17" placeholder="Número de serie" style="text-transform:uppercase;">
        </div>
        <div class="form-group">
          <label>Tipo de servicio *</label>
          <select id="sc_servicio" required>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="Diagnóstico">Diagnóstico</option>
            <option value="Reparación">Reparación</option>
          </select>
        </div>
        <div class="form-group" style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="sc_valet" style="width:18px; height:18px; accent-color: var(--primary);">
          <label for="sc_valet" style="margin:0;">Requiere Valet (Sin costo)</label>
        </div>
        <div class="form-group">
          <label>Comentarios adicionales</label>
          <textarea id="sc_notas" rows="2"></textarea>
        </div>
        <button type="submit" id="btnGuardarSC" class="btn" style="background:var(--primary);">
          Registrar Ingreso Sin Cita
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://kfspfziawwwzlqfsvpep.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_O8dWIEqgtNt3uSO_964wkg_-3AaUdgV';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let citaActual = null;
  let html5QrcodeScanner = null;
  let bloqueado = false;
  let qrYaProcesado = false;

  function cambiarVista(vista) {
    if (vista === 'escaner') {
      document.getElementById('vistaEscaner').style.display = 'block';
      document.getElementById('vistaSinCita').style.display = 'none';
      document.getElementById('tabEscaner').classList.add('active');
      document.getElementById('tabSinCita').classList.remove('active');
    } else {
      document.getElementById('vistaEscaner').style.display = 'none';
      document.getElementById('vistaSinCita').style.display = 'block';
      document.getElementById('tabEscaner').classList.remove('active');
      document.getElementById('tabSinCita').classList.add('active');
    }
  }

  function iniciarCamara() {
    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 230, height: 230 } },
      onScanSuccess
    ).catch(() => {
      document.getElementById('statusText').textContent = "Activa el permiso de cámara en tu navegador.";
    });
  }

  async function onScanSuccess(decodedText) {
    if (bloqueado) return;
    bloqueado = true;
    document.getElementById('statusText').textContent = "Consultando cita...";

    const { data, error } = await supabaseClient
      .from('citas')
      .select('*')
      .eq('id', decodedText.trim())
      .single();

    if (error || !data) {
      alert("Código QR no encontrado.");
      bloqueado = false;
      document.getElementById('statusText').textContent = "Apunta la cámara al QR del cliente";
      return;
    }

    html5QrcodeScanner.pause();
    mostrarFicha(data);
  }

  function mostrarFicha(cita) {
    citaActual = cita;
    document.getElementById('fichaCliente').style.display = 'block';
    document.getElementById('estadoActualBadge').textContent = cita.estado;

    document.getElementById('valNombre').textContent = cita.cliente_nombre;
    document.getElementById('valServicio').textContent = cita.tipo_servicio || 'No especificado';
    document.getElementById('valVin').textContent = cita.vin || 'SIN VIN REGISTRADO';

    const fechaTexto = new Date(cita.fecha_cita).toLocaleString('es-MX', {
      dateStyle: 'medium',
      timeStyle: 'short'
    });

    document.getElementById('extraDatos').innerHTML = `
      <strong>Vehículo:</strong> ${cita.modelo || 'N/A'} ${cita.placa ? '· Placa: ' + cita.placa : ''}<br>
      <strong>Hora cita:</strong> ${fechaTexto}<br>
      <strong>Valet:</strong> ${cita.requiere_valet ? 'SÍ requiere (Sin costo)' : 'No requiere'}<br>
      ${cita.notas ? '<strong>Notas:</strong> ' + cita.notas : ''}
    `;

    // Bloquea si el QR ya tenía un estatus distinto a 'Pendiente' o si ya se procesó en esta sesión
    const yaEscaneado = qrYaProcesado || (cita.estado && cita.estado !== 'Pendiente');
    const alerta = document.getElementById('alertaYaUsado');
    const bloqueAcciones = document.getElementById('bloqueAcciones');
    const btns = document.querySelectorAll('#bloqueAcciones button');

    if (yaEscaneado) {
      document.getElementById('statusText').textContent = "QR ya escaneado anteriormente";
      alerta.style.display = 'block';
      bloqueAcciones.style.display = 'none';
      btns.forEach(b => b.disabled = true);
    } else {
      document.getElementById('statusText').textContent = "Cita cargada";
      alerta.style.display = 'none';
      bloqueAcciones.style.display = 'block';
      btns.forEach(b => b.disabled = false);
    }
  }

  async function actualizarEstatus(nuevoEstado) {
    if (!citaActual || qrYaProcesado || (citaActual.estado && citaActual.estado !== 'Pendiente')) {
      alert("Este QR ya fue escaneado y no se puede volver a registrar.");
      return;
    }

    const { data, error } = await supabaseClient
      .from('citas')
      .update({
        estado: nuevoEstado,
        hora_llegada: new Date().toISOString()
      })
      .eq('id', citaActual.id)
      .eq('estado', 'Pendiente')
      .select()
      .single();

    if (error || !data) {
      alert("Este QR ya había sido procesado o ocurrió un error al actualizar.");
      return;
    }

    qrYaProcesado = true;
    mostrarFicha(data);
    alert(`Estatus actualizado a: ${nuevoEstado}. Este QR queda bloqueado para futuros escaneos.`);
  }

  function reiniciarEscaner() {
    citaActual = null;
    bloqueado = false;
    qrYaProcesado = false;
    document.getElementById('fichaCliente').style.display = 'none';
    document.getElementById('alertaYaUsado').style.display = 'none';
    document.getElementById('bloqueAcciones').style.display = 'block';
    document.getElementById('statusText').textContent = "Apunta la cámara al QR del cliente";
    html5QrcodeScanner.resume();
  }

  // Registro rápido Sin Cita
  document.getElementById('formSinCita').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnGuardarSC');
    btn.disabled = true;
    btn.textContent = 'Registrando...';

    const registro = {
      cliente_nombre: document.getElementById('sc_nombre').value.trim(),
      telefono: document.getElementById('sc_telefono').value.trim(),
      correo: document.getElementById('sc_correo').value.trim(),
      modelo: document.getElementById('sc_modelo').value.trim(),
      placa: document.getElementById('sc_placa').value.trim().toUpperCase(),
      vin: document.getElementById('sc_vin').value.trim().toUpperCase(),
      tipo_servicio: document.getElementById('sc_servicio').value,
      requiere_valet: document.getElementById('sc_valet').checked,
      notas: document.getElementById('sc_notas').value.trim(),
      fecha_cita: new Date().toISOString(),
      hora_llegada: new Date().toISOString(),
      estado: 'Sin cita',
      es_sin_cita: true
    };

    const { error } = await supabaseClient.from('citas').insert([registro]);

    btn.disabled = false;
    btn.textContent = 'Registrar Ingreso Sin Cita';

    if (error) {
      alert('Error al registrar: ' + error.message);
      return;
    }

    document.getElementById('formSinCita').reset();
    alert('Cliente sin cita registrado correctamente en el monitor.');
    cambiarVista('escaner');
  });

  iniciarCamara();
</script>
</body>
</html>
